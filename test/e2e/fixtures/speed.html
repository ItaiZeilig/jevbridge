<!doctype html><html><head><meta charset="utf-8"><title>Speed</title>
<style>body{font:14px sans-serif;margin:10px}
 header{background:#eee;padding:6px} nav a{margin-right:8px}
 .day{position:relative;width:40px;height:40px;display:inline-block;border:1px solid #ccc}
 .day input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0}
 .card{border:1px solid #999;padding:6px;margin:6px;width:260px}
 </style></head><body>
<header><nav><a href="/home">Home</a> <a href="/about">About</a> <button onclick="o('nav clicked')">Sign in</button></nav></header>
<main>
 <button onclick="o('task clicked')">Do the task</button>
 <!-- calendar-style duplicate: an outer clickable cell wrapping a real checkbox, same rect -->
 <div class="day" role="button" aria-label="Tuesday, October 20, 2026" onclick="o('cell clicked')"><input type="checkbox" aria-label="Tuesday, October 20, 2026" onclick="event.stopPropagation();o('checkbox '+this.checked)"></div>
 <!-- card with 3 links to the exact same hotel page -->
 <div class="card">
  <a href="/hotel/acme-inn.html?a=1" onclick="event.preventDefault();o('photo clicked')">[photo]</a>
  <a href="/hotel/acme-inn.html?a=1" onclick="event.preventDefault();o('title clicked')">Acme Inn</a>
  <a href="/hotel/acme-inn.html?a=1" onclick="event.preventDefault();o('info clicked')">Opens Acme Inn information</a>
  <a href="/other-hotel.html" onclick="event.preventDefault();o('other clicked')">Different Hotel</a>
 </div>
</main>
<p id="out"></p>
<script>function o(s){document.getElementById('out').textContent=s}</script>
</body></html>
